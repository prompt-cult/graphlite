name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  verify-tag:
    name: Verify tag matches workspace version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG}"

      - name: Tag must match manifest version
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          VERSION="v$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p')"
          echo "workspace version: ${VERSION}"
          echo "tag:               ${TAG}"
          if [ "${TAG}" != "${VERSION}" ]; then
            echo "::error::tag ${TAG} does not match workspace version ${VERSION} — bump Cargo.toml and commit before tagging"
            exit 1
          fi

  build-release:
    name: Build Release - ${{ matrix.asset_name }}
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # blacksmith-6vcpu-macos-15 is an arm64 (Apple Silicon) runner, so
          # macos-aarch64 is a native build and macos-x86_64 is a
          # cross-compile via the installed target.
          - os: blacksmith-6vcpu-macos-15
            target: aarch64-apple-darwin
            asset_name: graphlite-macos-aarch64
          - os: blacksmith-6vcpu-macos-15
            target: x86_64-apple-darwin
            asset_name: graphlite-macos-x86_64
          - os: blacksmith-4vcpu-ubuntu-2404-arm
            target: aarch64-unknown-linux-gnu
            asset_name: graphlite-linux-aarch64
          - os: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
            asset_name: graphlite-linux-x86_64
          # Windows lanes stay commented out until macOS + linux aarch64 +
          # linux x86_64 are all green on a released tag.
          # - os: blacksmith-4vcpu-windows-2025
          #   target: x86_64-pc-windows-msvc
          #   asset_name: graphlite-windows-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo git
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-build-release-

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p gql-cli

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/graphlite

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/graphlite ${{ matrix.asset_name }}

      - name: Generate checksum
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          else
            sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-tag.outputs.tag }}
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  # PyPI publishing is tracked separately; it needs a PYPI_API_TOKEN secret
  # that this repo does not have, so the wheel lane is not part of this
  # workflow.

  create-release:
    name: Create Release
    needs: [verify-tag, build-release]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # softprops/action-gh-release@v2 replaces the deprecated
      # actions/create-release@v1 + actions/upload-release-asset@v1 pair from
      # the prior art. Assets are attached by the build-release job against
      # the same tag; this final pass attaches the release body. Files
      # already uploaded are left untouched.
      - name: Create / annotate release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-tag.outputs.tag }}
          generate_release_notes: true
          body: |
            ## GraphLite ${{ needs.verify-tag.outputs.tag }}

            ### Downloads
            - Linux (x86_64): `graphlite-linux-x86_64`
            - Linux (ARM64): `graphlite-linux-aarch64`
            - macOS (x86_64): `graphlite-macos-x86_64`
            - macOS (Apple Silicon): `graphlite-macos-aarch64`

            SHA-256 checksums are provided for every asset (`*.sha256`).

            ### Installation
            ```bash
            chmod +x graphlite-*
            sudo mv graphlite-<os>-<arch> /usr/local/bin/graphlite
            ```

            ### Changes
            See the release notes below for the changes in this release.
